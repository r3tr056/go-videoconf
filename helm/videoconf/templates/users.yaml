apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "videoconf.fullname" . }}-users
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
    app.kubernetes.io/component: users
spec:
  {{- if not .Values.users.autoscaling.enabled }}
  replicas: {{ .Values.users.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "videoconf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: users
  template:
    metadata:
      labels:
        {{- include "videoconf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: users
    spec:
      containers:
        - name: users
          image: {{ include "videoconf.image" (dict "root" . "name" .Values.users.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: GIN_MODE
              value: release
            - name: DB_HOST
              value: {{ include "videoconf.fullname" . }}-mongo
            - name: DB_PORT
              value: "27017"
            - name: DB_NAME
              value: vidchat
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "videoconf.secretName" . }}
                  key: mongo-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "videoconf.secretName" . }}
                  key: mongo-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "videoconf.secretName" . }}
                  key: jwt-secret
            - name: JWT_ISSUER
              value: VideoConf
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "videoconf.fullname" . }}-users
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
    app.kubernetes.io/component: users
spec:
  type: ClusterIP
  selector:
    {{- include "videoconf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: users
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
---
{{- if .Values.users.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "videoconf.fullname" . }}-users
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
    app.kubernetes.io/component: users
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "videoconf.fullname" . }}-users
  minReplicas: {{ .Values.users.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.users.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.users.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
