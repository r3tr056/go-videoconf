apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "videoconf.fullname" . }}-turn-config
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
data:
  turn-config.json: |
    {"url": {{ .Values.turn.publicUrl | quote }}, "username": {{ .Values.turn.user | quote }}, "credential": {{ required "secrets.turnPassword is required (see values.yaml)" .Values.secrets.turnPassword | quote }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "videoconf.fullname" . }}-client
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  {{- if not .Values.client.autoscaling.enabled }}
  replicas: {{ .Values.client.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "videoconf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        {{- include "videoconf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: client
    spec:
      containers:
        - name: client
          image: {{ include "videoconf.image" (dict "root" . "name" .Values.client.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: turn-config
              mountPath: /usr/share/nginx/html/turn-config.json
              subPath: turn-config.json
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: turn-config
          configMap:
            name: {{ include "videoconf.fullname" . }}-turn-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "videoconf.fullname" . }}-client
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: ClusterIP
  selector:
    {{- include "videoconf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: client
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
---
{{- if .Values.client.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "videoconf.fullname" . }}-client
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "videoconf.fullname" . }}-client
  minReplicas: {{ .Values.client.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.client.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.client.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
