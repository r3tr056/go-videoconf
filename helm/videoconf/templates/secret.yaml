{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "videoconf.secretName" . }}
  labels:
    {{- include "videoconf.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret is required (see values.yaml)" .Values.secrets.jwtSecret | quote }}
  turn-password: {{ required "secrets.turnPassword is required (see values.yaml)" .Values.secrets.turnPassword | quote }}
  mongo-username: {{ .Values.secrets.mongoUsername | quote }}
  mongo-password: {{ .Values.secrets.mongoPassword | quote }}
  turn-username: {{ .Values.turn.user | quote }}
{{- end }}
